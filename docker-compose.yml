# Stack pronta para o Portainer (Stacks > Add stack > Web editor).
# Cole este arquivo e preencha as variáveis na aba "Environment variables".
#
# A imagem é publicada no Docker Hub pelo GitHub Actions a cada push
# (.github/workflows/ci.yml). Para atualizar depois de um push novo:
# Stacks > sua stack > Pull and redeploy.
services:
  clickup-export:
    image: ${DOCKER_IMAGE:-SEU_USUARIO_DOCKERHUB/clickup-export:latest}
    # Para buildar local em vez de puxar do Docker Hub, comente a linha acima
    # e descomente a de baixo:
    # build: .
    container_name: clickup-export
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      CLICKUP_TOKEN: ${CLICKUP_TOKEN}
      CLICKUP_FOLDER_ID: ${CLICKUP_FOLDER_ID}
      CLICKUP_INCLUDE_CLOSED: ${CLICKUP_INCLUDE_CLOSED:-true}
      CLICKUP_INCLUDE_SUBTASKS: ${CLICKUP_INCLUDE_SUBTASKS:-true}
      CLICKUP_INCLUDE_ARCHIVED: ${CLICKUP_INCLUDE_ARCHIVED:-false}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      APP_TITLE: ${APP_TITLE:-Negócios Precatório}
      TZ: ${TZ:-America/Sao_Paulo}
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
