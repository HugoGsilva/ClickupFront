# Stack para Docker Swarm + Traefik (Portainer > Stacks > Add stack > Web editor).
# Para Docker simples, sem Swarm, use o docker-compose.yml.
#
# Preencha na aba "Environment variables" do Portainer — só estas três:
#   CLICKUP_TOKEN, AUTH_USER, AUTH_PASSWORD
#
# O escopo (a pasta e os nomes que aparecem) vem fixo em src/listas.js — não
# precisa de variável. As de escopo abaixo são só para sobrescrever isso.
version: "3.8"

services:
  clickup-export:
    # Publicada pelo GitHub Actions a cada push. Para travar numa versão
    # específica, defina DOCKER_IMAGE com uma tag sha-xxxxxxx.
    image: ${DOCKER_IMAGE:-hugogsilva/clickup-export:latest}
    environment:
      CLICKUP_TOKEN: "${CLICKUP_TOKEN:?CLICKUP_TOKEN is required}"

      AUTH_USER: "${AUTH_USER:?AUTH_USER is required}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?AUTH_PASSWORD is required}"

      # Escopo — opcionais. Vazias = a pasta e os nomes fixos de src/listas.js.
      #   CLICKUP_ALL_LISTS=true  -> mostra TODAS as listas da pasta
      #   CLICKUP_FOLDER_ID=<id>  -> aponta para outra pasta
      #   CLICKUP_LIST_IDS=a,b,c  -> listas avulsas
      CLICKUP_ALL_LISTS: "${CLICKUP_ALL_LISTS:-false}"
      CLICKUP_FOLDER_ID: "${CLICKUP_FOLDER_ID:-}"
      CLICKUP_LIST_IDS: "${CLICKUP_LIST_IDS:-}"

      # O que entra na exportação.
      CLICKUP_INCLUDE_CLOSED: "${CLICKUP_INCLUDE_CLOSED:-true}"
      CLICKUP_INCLUDE_SUBTASKS: "${CLICKUP_INCLUDE_SUBTASKS:-true}"
      CLICKUP_INCLUDE_ARCHIVED: "${CLICKUP_INCLUDE_ARCHIVED:-false}"

      # Traefik está na frente, então o app pode confiar no X-Forwarded-For
      # para identificar o cliente no freio de força bruta.
      # 1 = confie só no salto imediatamente à frente (o Traefik). "true"
      # confiaria em qualquer X-Forwarded-For, inclusive forjado.
      TRUST_PROXY: "1"

      APP_TITLE: "${APP_TITLE:-Negócios Precatório}"
      TZ: "${TZ:-America/Sao_Paulo}"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          # Medido: exportar a pasta inteira (19 listas, ~92 mil tarefas) tem
          # pico de ~262 MB. 1G dá folga confortável.
          memory: 1G
      labels:
        - traefik.enable=true
        - traefik.http.routers.clickup-export.rule=Host(`testeclickup.hugogsilva.dev`)
        - traefik.http.routers.clickup-export.entrypoints=websecure
        - traefik.http.routers.clickup-export.tls.certresolver=letsencryptresolver
        - traefik.http.routers.clickup-export.service=clickup-export
        - traefik.http.services.clickup-export.loadbalancer.server.port=3000

networks:
  network_swarm_public:
    external: true
